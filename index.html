<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProLookup - Hacker OS Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            /* Premium Default Theme */
            --theme-color: #00e5ff;
            --theme-glow: rgba(0, 229, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Rajdhani', sans-serif; color: #fff;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; background-color: #050505; 
        }

        /* --- 100% SAFE DUAL BACKGROUND SYSTEM --- */
        .bg-layer {
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: opacity 1s ease-in-out;
            opacity: 0;
            animation: liveBg 30s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes liveBg {
            0% { transform: scale(1) translate(0px, 0px); }
            100% { transform: scale(1.1) translate(-15px, -15px); }
        }

        /* Telecom Space Background */
        .bg-number {
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1080&auto=format&fit=crop');
        }
        .bg-number.active { opacity: 0.35; }

        /* Free Fire Aag (Flames) Background - 100% Load Guarantee */
        .bg-ff {
            background-image: url('https://images.unsplash.com/photo-1580136453966-281ce13d7fb6?q=80&w=1080&auto=format&fit=crop');
            filter: contrast(1.2) saturate(1.5);
        }
        .bg-ff.active { opacity: 0.55; }


        .dashboard {
            width: 100%; max-width: 850px; background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--theme-color); border-radius: 16px;
            box-shadow: 0 0 40px var(--theme-glow); overflow: hidden;
            z-index: 10; margin: 20px;
        }

        .header {
            text-align: center; padding: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem;
            color: var(--theme-color); text-shadow: 0 0 10px var(--theme-glow); letter-spacing: 2px;
        }
        .header p { color: #aaa; font-size: 1.1rem; margin-top: 5px; }

        .tabs { display: flex; background: rgba(0, 0, 0, 0.6); }
        .tab-btn {
            flex: 1; padding: 15px; background: transparent; border: none; color: #888;
            font-family: 'Orbitron', sans-serif; font-size: 1rem; cursor: pointer;
            border-bottom: 3px solid transparent; text-transform: uppercase;
        }
        .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active {
            color: var(--theme-color); border-bottom-color: var(--theme-color);
            text-shadow: 0 0 8px var(--theme-glow); background: rgba(255, 255, 255, 0.05);
        }

        .content { padding: 30px; min-height: 400px; }
        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; gap: 15px; margin-bottom: 25px; }
        input[type="text"] {
            flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px; border-radius: 8px; color: #fff; font-size: 1.2rem;
            font-family: 'Rajdhani', sans-serif; outline: none; letter-spacing: 1px;
        }
        input[type="text"]:focus { border-color: var(--theme-color); box-shadow: 0 0 15px var(--theme-glow); }

        button.run-btn {
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--theme-color);
            color: var(--theme-color); padding: 0 30px; font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; box-shadow: 0 0 10px var(--theme-glow) inset;
        }
        button.run-btn:hover { background: var(--theme-color); color: #000; box-shadow: 0 0 20px var(--theme-glow); }

        .output-box {
            background: rgba(0, 0, 0, 0.6); border: 1px dashed var(--theme-color);
            border-radius: 8px; padding: 20px; min-height: 200px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .placeholder { text-align: center; color: #666; font-size: 1.2rem; font-family: 'Orbitron', sans-serif; }

        .record-header {
            color: #fff; background: rgba(255,255,255,0.1); font-family: 'Orbitron', sans-serif;
            margin: 20px 0 10px 0; padding: 5px 10px; border-left: 4px solid var(--theme-color);
            text-shadow: 0 0 5px var(--theme-glow); font-size: 1rem; letter-spacing: 1px;
        }

        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.15rem; }
        .data-label { color: #aaa; }
        .data-value { color: #fff; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.3); text-align: right; max-width: 65%; word-wrap: break-word;}

        .success-badge { display: block; text-align: center; color: var(--theme-color); font-family: 'Orbitron', sans-serif; margin-bottom: 15px; font-size: 1.3rem; text-shadow: 0 0 10px var(--theme-glow); }
        .error-badge { display: block; text-align: center; color: #ff003c; font-family: 'Orbitron', sans-serif; font-size: 1.3rem; text-shadow: 0 0 10px rgba(255, 0, 60, 0.5); }

        .loader { width: 50px; height: 50px; border: 3px solid transparent; border-top-color: var(--theme-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Action Buttons */
        .action-buttons { display: none; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn {
            flex: 1; min-width: 120px; padding: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--theme-color); color: var(--theme-color);
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-align: center; text-transform: uppercase;
            box-shadow: inset 0 0 5px var(--theme-glow);
        }
        .action-btn:hover { background: var(--theme-color); color: #000; box-shadow: 0 0 15px var(--theme-glow); }

        .raw-code-box {
            background: rgba(0, 0, 0, 0.7); padding: 12px; border-radius: 6px; border: 1px dashed #666;
            font-family: monospace; font-size: 0.95rem; color: #ffeb3b; text-align: center; margin-top: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Developer Footer UI */
        .dev-watermark {
            margin-top: 25px; padding-top: 15px; border-top: 1px dashed var(--theme-color);
            text-align: center; font-family: 'Orbitron', sans-serif; animation: fadeIn 1s ease;
        }
        .dev-watermark .name { color: var(--theme-color); font-size: 1.1rem; text-shadow: 0 0 8px var(--theme-glow); font-weight: bold; }
        .dev-watermark .contact { color: #aaa; font-size: 0.9rem; margin-top: 5px; letter-spacing: 1px; }

    </style>
</head>
<body class="theme-number">

<!-- DUAL BACKGROUND LAYERS (Fail-Proof) -->
<div class="bg-layer bg-number active" id="bgNumber"></div>
<div class="bg-layer bg-ff" id="bgFF"></div>

<div class="dashboard">
    <div class="header">
        <h1 id="mainTitle">TELECOM OS</h1>
        <p id="subTitle">National Carrier Database Access</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTheme('number', this)">📱 NUMBER</button>
        <button class="tab-btn" onclick="switchTheme('ffmax', this)">🎮 GARENA DB</button>
    </div>

    <div class="content">
        <!-- Number Tab -->
        <div id="number" class="tab-content active">
            <div class="input-group">
                <input type="text" id="numInput" placeholder="Enter Mobile Target..." onkeydown="if(event.key==='Enter') fetchNumber()">
                <button class="run-btn" onclick="fetchNumber()">Trace</button>
            </div>
            <div id="numOutput" class="output-box">
                <div class="placeholder">ENTER TARGET NUMBER TO INITIATE TRACE...</div>
            </div>
            <div class="action-buttons" id="numActions">
                <button class="action-btn" onclick="exportData('txt', 'number')">📄 Save TXT</button>
                <button class="action-btn" onclick="exportData('pdf', 'number')">📕 Save PDF</button>
                <button class="action-btn" onclick="shareData('number')">🔗 Share</button>
            </div>
        </div>

        <!-- FF Max Tab -->
        <div id="ffmax" class="tab-content">
            <div class="input-group">
                <input type="text" id="ffInput" placeholder="Enter Player UID..." onkeydown="if(event.key==='Enter') fetchFF()">
                <button class="run-btn" onclick="fetchFF()">Extract</button>
            </div>
            <div id="ffOutput" class="output-box">
                <div class="placeholder">AWAITING FREE FIRE UID...</div>
            </div>
            <div class="action-buttons" id="ffActions">
                <button class="action-btn" onclick="exportData('txt', 'ffmax')">📄 Save TXT</button>
                <button class="action-btn" onclick="exportData('pdf', 'ffmax')">📕 Save PDF</button>
                <button class="action-btn" onclick="shareData('ffmax')">🔗 Share</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentNumDataText = "";
    let currentFFDataText = "";

    // --- AUDIO SYNTHESIZER ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    
    function playSound(type) {
        initAudio(); 
        const osc = audioCtx.createOscillator(); 
        const gain = audioCtx.createGain();
        osc.connect(gain); 
        gain.connect(audioCtx.destination); 
        const now = audioCtx.currentTime;

        if (type === 'dial') {
            osc.type = 'sine'; 
            const freqs = [697, 770, 852, 941, 1209, 1336, 1477];
            osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); 
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'type') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03); 
            osc.start(now); osc.stop(now + 0.03);
        } else if (type === 'click') {
            osc.type = 'square'; osc.frequency.setValueAtTime(1000, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.06);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06); 
            osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'success') {
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); 
            osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.35); 
            gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.7); 
            osc.start(now); osc.stop(now + 0.7);
        } else if (type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); 
            osc.start(now); osc.stop(now + 0.15);
        }
    }

    document.getElementById('numInput').addEventListener('input', () => playSound('dial'));
    document.getElementById('ffInput').addEventListener('input', () => playSound('type'));

    // --- Theme Switching (CSS ONLY - NO JS IMAGE LOADING) ---
    const titles = {
        'number': { main: 'TELECOM OS', sub: 'National Carrier Database Access' },
        'ffmax': { main: 'GARENA DB', sub: 'Official Global Server Extraction' }
    };
    
    function switchTheme(theme, btnElement) {
        playSound('click'); 
        
        // CSS Variables update
        if(theme === 'ffmax') {
            document.documentElement.style.setProperty('--theme-color', '#ff003c');
            document.documentElement.style.setProperty('--theme-glow', 'rgba(255, 0, 60, 0.6)');
            
            // Switch Background Layer
            document.getElementById('bgNumber').classList.remove('active');
            document.getElementById('bgFF').classList.add('active');
        } else {
            document.documentElement.style.setProperty('--theme-color', '#00e5ff');
            document.documentElement.style.setProperty('--theme-glow', 'rgba(0, 229, 255, 0.5)');
            
            // Switch Background Layer
            document.getElementById('bgFF').classList.remove('active');
            document.getElementById('bgNumber').classList.add('active');
        }
        
        document.getElementById('mainTitle').innerText = titles[theme].main; 
        document.getElementById('subTitle').innerText = titles[theme].sub;
        
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(theme).classList.add('active'); 
        btnElement.classList.add('active');
    }

    const loaderHtml = `<div class="loader"></div>`;
    const devHtml = `<div class="dev-watermark"><div class="name">👑 Developer: Hacker Jamal</div><div class="contact">📞 Contact: +919708256311</div></div>`;

    // --- 1. NUMBER LOOKUP API ---
    async function fetchNumber() {
        playSound('click');
        let numInput = document.getElementById('numInput').value.trim().replace(/[^0-9]/g, ''); 
        const output = document.getElementById('numOutput');
        const actions = document.getElementById('numActions');
        actions.style.display = 'none';
        
        if(!numInput) { playSound('error'); return alert("Target mobile number required!"); }
        output.innerHTML = loaderHtml; output.style.justifyContent = "center"; 

        try {
            const API_URL = "https://api.naxupdate.workers.dev/api/number-info";
            const res = await fetch(`${API_URL}?key=30Day&number=${numInput}`);
            const jsonResp = await res.json(); 
            const data = jsonResp.data || jsonResp;

            if (data.found === false || !data.result || data.result.length === 0) {
                playSound('error'); output.innerHTML = `<div class="error-badge">⚠ NO RECORDS FOUND</div>`; return;
            }

            playSound('success'); output.style.justifyContent = "flex-start"; 
            let htmlStr = `<div class="success-badge">► TRACE SUCCESSFUL ◄</div>`;
            let textExport = `--- OSINT TARGET INFO: ${numInput} ---\nTotal Records: ${data.count || 0}\n\n`;

            if (data.result && Array.isArray(data.result)) {
                data.result.forEach((rec, idx) => {
                    htmlStr += `<div class="record-header">► RECORD ${idx + 1}</div>`;
                    textExport += `[RECORD ${idx + 1}]\n`;
                    const addRow = (label, val) => {
                        if(val) {
                            htmlStr += `<div class="data-row"><span class="data-label">${label}</span> <span class="data-value">${val}</span></div>`;
                            textExport += `${label}: ${val}\n`;
                        }
                    };
                    addRow("Name", rec.name); addRow("Father's Name", rec.father_name);
                    addRow("Mobile", rec.mobile); addRow("Alt Mobile", rec.alt_mobile);
                    addRow("State / Circle", rec.circle); addRow("Email", rec.email);
                    addRow("Address", rec.address ? rec.address.replace(/!/g, ', ').replace(/,$/, '').trim() : "");
                    textExport += `\n`;
                });
            }
            
            htmlStr += devHtml;
            output.innerHTML = htmlStr;
            currentNumDataText = textExport;
            actions.style.display = 'flex';
        } catch (err) { 
            playSound('error'); output.innerHTML = `<div class="error-badge">⚠ CONNECTION REFUSED</div>`;
        }
    }

    // --- 2. FF MAX DEEP EXTRACTION API ---
    async function fetchFF() {
        playSound('click');
        const uid = document.getElementById('ffInput').value.trim();
        const output = document.getElementById('ffOutput');
        const actions = document.getElementById('ffActions');
        actions.style.display = 'none';

        if(!uid) { playSound('error'); return alert("Player UID required!"); }
        output.innerHTML = loaderHtml; output.style.justifyContent = "center";

        try {
            const res = await fetch(`https://freeapisbyadii.vercel.app/api/svc/player?uid=${uid}&region=ind`);
            const jsonResp = await res.json();
            
            if(jsonResp.success) {
                playSound('success'); output.style.justifyContent = "flex-start";
                const p = jsonResp.data.basicInfo || {};
                const clan = jsonResp.data.clanBasicInfo || {};
                const social = jsonResp.data.socialInfo || {};
                const credit = jsonResp.data.creditScoreInfo || {};
                
                const formatDate = (ts) => ts ? new Date(ts * 1000).toLocaleString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : "N/A";
                
                let accountAge = "Unknown";
                if(p.createAt) {
                    const days = Math.floor((Date.now() - (p.createAt * 1000)) / (1000 * 60 * 60 * 24));
                    accountAge = `${days} Days Old`;
                }

                const rawSignature = social.signature || "N/A";
                let cleanSignature = rawSignature.replace(/\[.*?\]/g, '').trim();
                
                let bindType = "Guest / Unlinked";
                if (p.accountType === 1) bindType = "Facebook";
                else if (p.accountType === 2) bindType = "VKontakte (VK)";
                else if (p.accountType === 3) bindType = "Google (Email)";
                else if (p.accountType === 5) bindType = "Twitter";
                else if (p.accountType === 6) bindType = "Apple ID";

                let gameClient = "Free Fire (Standard)";
                if (p.accountPrefers && p.accountPrefers.brPregameShowChoices) {
                    gameClient = "Free Fire MAX"; 
                }

                const evoCount = p.weaponSkinShows ? p.weaponSkinShows.length : 0;
                const badges = p.badgeCnt || 0;
                
                const currentXp = p.exp || 0;
                const currentLv = p.level || 0;
                const estNextXp = Math.floor(currentXp * 1.045); 
                const xpNeeded = estNextXp - currentXp;

                let html = `<div class="success-badge">► DEEP DATA EXTRACTED ◄</div>`;
                let textExport = `--- GARENA DB TARGET: ${uid} ---\n\n`;

                const addSection = (title) => { html += `<div class="record-header">► ${title}</div>`; textExport += `\n[ ${title} ]\n`; };
                const addRow = (label, val, highlight = false) => {
                    html += `<div class="data-row"><span class="data-label">${label}</span> <span class="data-value" ${highlight ? 'style="color:var(--theme-color);"' : ''}>${val}</span></div>`;
                    textExport += `${label}: ${val}\n`;
                };

                addSection("ACCOUNT IDENTITY");
                addRow("IGN (Name)", p.nickname || 'N/A');
                addRow("Account UID", p.accountId || uid);
                addRow("Client Version", gameClient, true);
                addRow("Linked Via", bindType, true);
                addRow("Account Age", accountAge);
                addRow("Created On", formatDate(p.createAt));
                addRow("Last Login", formatDate(p.lastLoginAt), true);

                addSection("PROGRESSION & STATS");
                addRow("Current Level", `Lv. ${currentLv}`);
                addRow("Current EXP", `${currentXp.toLocaleString()} XP`);
                addRow("Level Up Status", `${xpNeeded.toLocaleString()} XP required for Lv. ${currentLv + 1}`, true);
                addRow("Total Likes", `${p.liked || '0'} ❤️`);
                addRow("Booyah Pass Badges", `${badges} Badges`, true);
                addRow("Credit Score", `${credit.creditScore || '0'} / 100`, true);
                
                addSection("COMBAT & INVENTORY");
                addRow("BR Rank Points", p.rankingPoints || '0');
                addRow("CS Rank Points", p.csRankingPoints || '0');
                addRow("Premium Evo Guns", `${evoCount} Equipped`, true);
                addRow("Matches Played", "Encrypted by Garena DB"); 
                addRow("KD Ratio", "Requires Level 2 Auth Bypass");

                if(clan && clan.clanName) {
                    addSection("GUILD INTELLIGENCE");
                    addRow("Guild Name", clan.clanName);
                    addRow("Guild ID", clan.clanId);
                    addRow("Guild Level", `Lv. ${clan.clanLevel || '0'}`);
                    addRow("Members", `${clan.memberNum || 0} / ${clan.capacity || 0}`);
                }

                if(rawSignature !== "N/A") {
                    addSection("PLAYER SIGNATURE / BIO");
                    addRow("Parsed Signature", cleanSignature || "Empty");
                    html += `<div class="data-row" style="margin-top: 10px;"><span class="data-label">Raw Source Code:</span></div>`;
                    html += `<div class="raw-code-box">${rawSignature.replace(/</g, '&lt;')}</div>`;
                    textExport += `Parsed Bio: ${cleanSignature}\nRaw Source Code: ${rawSignature}\n`;
                }

                html += devHtml;
                output.innerHTML = html;
                currentFFDataText = textExport;
                actions.style.display = 'flex';
            } else {
                playSound('error'); output.innerHTML = `<div class="error-badge">⚠ PLAYER NOT FOUND</div>`;
            }
        } catch (error) {
            playSound('error'); output.innerHTML = `<div class="error-badge">⚠ SERVER CONNECTION FAILED</div>`;
        }
    }

    // --- DATA EXPORT & SHARE SYSTEM ---
    const watermarkText = "\n\n=================================\n 🛡️ Extracted via ProLookup OS\n 👑 Developer: Hacker Jamal\n 📞 Contact: +919708256311\n=================================";

    function exportData(format, source) {
        playSound('click');
        let rawData = source === 'number' ? currentNumDataText : currentFFDataText;
        if(!rawData) return alert("No data available to export.");
        const finalContent = rawData + watermarkText;

        if (format === 'txt') {
            const blob = new Blob([finalContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ProLookup_${source}_${Date.now()}.txt`;
            a.click(); URL.revokeObjectURL(url);
            playSound('success');
        } 
        else if (format === 'pdf') {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const cleanText = finalContent.replace(/[^\x00-\x7F]/g, ""); 
                doc.setFont("courier"); doc.setFontSize(10);
                const lines = doc.splitTextToSize(cleanText, 180);
                doc.text(lines, 10, 10);
                doc.save(`ProLookup_${source}_${Date.now()}.pdf`);
                playSound('success');
            } catch(e) {
                alert("PDF Generation Failed. Please check internet connection for the library.");
            }
        }
    }

    function shareData(source) {
        playSound('click');
        let rawData = source === 'number' ? currentNumDataText : currentFFDataText;
        if(!rawData) return;
        const finalContent = rawData + watermarkText;

        if (navigator.share) {
            navigator.share({ title: 'ProLookup Intelligence', text: finalContent }).catch(()=>{});
        } else {
            const tempInput = document.createElement("textarea");
            tempInput.value = finalContent; document.body.appendChild(tempInput);
            tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
            alert("Data Copied to Clipboard for sharing!");
        }
    }
</script>
</body>
</html>
