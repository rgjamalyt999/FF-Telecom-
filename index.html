<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProLookup - Hacker OS Elite Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --theme-color: #ff003c;
            --theme-glow: rgba(255, 0, 60, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Rajdhani', sans-serif; color: #fff;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; background-color: #030303; 
        }

        .bg-layer {
            position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover; background-position: center; z-index: -1;
            transition: opacity 1s ease-in-out; opacity: 0;
            animation: liveBg 30s infinite alternate ease-in-out; pointer-events: none;
        }

        @keyframes liveBg {
            0% { transform: scale(1) translate(0px, 0px); }
            100% { transform: scale(1.1) translate(-15px, -15px); }
        }

        .bg-number { background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1080&auto=format&fit=crop'); }
        .bg-number.active { opacity: 0.35; }
        .bg-ff { background-image: url('https://images.unsplash.com/photo-1580136453966-281ce13d7fb6?q=80&w=1080&auto=format&fit=crop'); filter: contrast(1.2) saturate(1.5); }
        .bg-ff.active { opacity: 0.55; }

        .dashboard {
            width: 100%; max-width: 480px; background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--theme-color); border-radius: 14px;
            box-shadow: 0 0 30px var(--theme-glow); overflow: hidden;
            z-index: 10; margin: 10px; display: flex; flex-direction: column;
        }

        .header {
            text-align: center; padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.7);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem;
            color: var(--theme-color); text-shadow: 0 0 10px var(--theme-glow); letter-spacing: 2px;
        }
        .header p { color: #aaa; font-size: 0.9rem; margin-top: 3px; }

        /* Tabs stacked vertically for clean mobile app view */
        .tabs { display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-btn {
            width: 100%; padding: 12px 10px; background: transparent; border: none; color: #888;
            font-family: 'Orbitron', sans-serif; font-size: 0.8rem; cursor: pointer;
            border-left: 4px solid transparent; text-transform: uppercase; text-align: left;
            padding-left: 20px; display: flex; align-items: center; gap: 10px;
        }
        .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active {
            color: var(--theme-color); border-left-color: var(--theme-color);
            text-shadow: 0 0 8px var(--theme-glow); background: rgba(255, 255, 255, 0.08);
            font-weight: bold;
        }

        .content { padding: 18px; min-height: 350px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        input[type="text"], select {
            width: 100%; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px; border-radius: 8px; color: #fff; font-size: 1.05rem;
            font-family: 'Rajdhani', sans-serif; outline: none; letter-spacing: 1px;
        }
        input[type="text"]:focus, select:focus { border-color: var(--theme-color); box-shadow: 0 0 12px var(--theme-glow); }
        select option { background: #111; color: #fff; }

        button.run-btn {
            width: 100%; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--theme-color);
            color: var(--theme-color); padding: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; box-shadow: 0 0 10px var(--theme-glow) inset; text-align: center;
        }
        button.run-btn:hover { background: var(--theme-color); color: #000; box-shadow: 0 0 20px var(--theme-glow); }

        .output-box {
            background: rgba(0, 0, 0, 0.75); border: 1px dashed var(--theme-color);
            border-radius: 8px; padding: 14px; min-height: 180px; max-height: 320px; overflow-y: auto;
            display: flex; flex-direction: column; justify-content: center;
        }
        .placeholder { text-align: center; color: #666; font-size: 0.95rem; font-family: 'Orbitron', sans-serif; }

        .record-header {
            color: #fff; background: rgba(255,255,255,0.1); font-family: 'Orbitron', sans-serif;
            margin: 14px 0 6px 0; padding: 5px 8px; border-left: 3px solid var(--theme-color);
            text-shadow: 0 0 5px var(--theme-glow); font-size: 0.85rem; letter-spacing: 1px;
        }

        .data-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1rem; gap: 8px; }
        .data-label { color: #aaa; flex-shrink: 0; font-size: 0.95rem; }
        .data-value { color: #fff; font-weight: bold; text-shadow: 0 0 4px rgba(255,255,255,0.3); text-align: right; word-break: break-all; font-size: 0.95rem; }

        .success-badge { display: block; text-align: center; color: var(--theme-color); font-family: 'Orbitron', sans-serif; margin-bottom: 10px; font-size: 1.05rem; text-shadow: 0 0 8px var(--theme-glow); }
        
        .loader { width: 40px; height: 40px; border: 3px solid transparent; border-top-color: var(--theme-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .action-buttons { display: none; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .action-btn {
            flex: 1; min-width: 90px; padding: 10px 5px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--theme-color); color: var(--theme-color);
            font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-align: center; text-transform: uppercase;
            box-shadow: inset 0 0 5px var(--theme-glow);
        }
        .action-btn:hover { background: var(--theme-color); color: #000; box-shadow: 0 0 12px var(--theme-glow); }

        .raw-code-box {
            background: rgba(0, 0, 0, 0.85); padding: 8px; border-radius: 6px; border: 1px dashed #666;
            font-family: monospace; font-size: 0.8rem; color: #ffeb3b; text-align: left; margin-top: 4px;
            max-height: 110px; overflow-y: auto; word-break: break-all;
        }

        .dev-watermark {
            margin-top: 18px; padding-top: 10px; border-top: 1px dashed var(--theme-color);
            text-align: center; font-family: 'Orbitron', sans-serif; animation: fadeIn 0.5s ease;
        }
        .dev-watermark .name { color: var(--theme-color); font-size: 0.9rem; text-shadow: 0 0 6px var(--theme-glow); font-weight: bold; }
        .dev-watermark .contact { color: #aaa; font-size: 0.75rem; margin-top: 3px; letter-spacing: 1px; }

        /* Perfect 9:16 Mobile App View Optimization */
        @media screen and (max-width: 480px) {
            body {
                align-items: center;
                background-color: #020202;
                padding: 5px;
            }
            .dashboard {
                margin: 0;
                width: 100%;
                max-width: 100%;
                min-height: 94vh;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body class="theme-ff">

<div class="bg-layer bg-number" id="bgNumber"></div>
<div class="bg-layer bg-ff active" id="bgFF"></div>

<div class="dashboard">

                <button class="run-btn" onclick="fetchNumber()">Trace Number</button>

</div>

<script>
    let currentNumDataText = "";
    let currentFFDataText = "";
    let currentReportDataText = "";

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    
    function playSound(type) {
        try {
            initAudio(); 
            const osc = audioCtx.createOscillator(); 
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); 
            const now = audioCtx.currentTime;

            if (type === 'dial') {
                osc.type = 'sine'; const freqs = [697, 770, 852, 941];
                osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], now);
                gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); 
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'type') {
                osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); 
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'click' || type === 'success') {
                osc.type = 'square'; osc.frequency.setValueAtTime(900, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06); 
                osc.start(now); osc.stop(now + 0.06);
            }
        } catch(e) {}
    }

    document.getElementById('numInput').addEventListener('input', () => playSound('dial'));
    document.getElementById('ffInput').addEventListener('input', () => playSound('type'));
    document.getElementById('reportUidInput').addEventListener('input', () => playSound('type'));

    const tabConfigs = {
        'ffmax': { main: 'GARENA DB', sub: 'Official Global Server Extraction', color: '#ff003c', glow: 'rgba(255, 0, 60, 0.6)' },
        'report': { main: 'REPORT CENTER', sub: 'Anti-Cheat Mass Report Dispatcher', color: '#ff003c', glow: 'rgba(255, 0, 60, 0.6)' },
        'number': { main: 'TELECOM OS', sub: 'National Carrier Database Access', color: '#00e5ff', glow: 'rgba(0, 229, 255, 0.5)' }
    };
    
    function switchTab(tabId, btnElement) {
        playSound('click'); 
        const cfg = tabConfigs[tabId];

        document.documentElement.style.setProperty('--theme-color', cfg.color);
        document.documentElement.style.setProperty('--theme-glow', cfg.glow);
        
        if(tabId === 'number') {
            document.getElementById('bgFF').classList.remove('active');
            document.getElementById('bgNumber').classList.add('active');
        } else {
            document.getElementById('bgNumber').classList.remove('active');
            document.getElementById('bgFF').classList.add('active');
        }
        
        document.getElementById('mainTitle').innerText = cfg.main; 
        document.getElementById('subTitle').innerText = cfg.sub;
        
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active'); 
        btnElement.classList.add('active');
    }

    const loaderHtml = `<div class="loader"></div>`;
    const devHtml = `<div class="dev-watermark"><div class="name">👑 Developer: Hacker Jamal</div><div class="contact">📞 Contact: +919708256311</div></div>`;

    async function fetchFF() {
        playSound('click');
        const uid = document.getElementById('ffInput').value.trim();
        const output = document.getElementById('ffOutput');
        const actions = document.getElementById('ffActions');
        actions.style.display = 'none';

        if(!uid) { playSound('click'); return alert("Player UID required!"); }
        output.innerHTML = loaderHtml; output.style.justifyContent = "center";

        try {
            const res = await fetch(`https://freeapisbyadii.vercel.app/api/svc/player?uid=${uid}&region=ind`);
            const jsonResp = await res.json();
            
            if(jsonResp.success && jsonResp.data) {
                renderFFResult(uid, jsonResp.data);
            } else {
                throw new Error("Invalid API");
            }
        } catch (error) {
            const mockFF = {
                basicInfo: {
                    nickname: "RG ┃ J A M A L Y T★",
                    accountId: uid,
                    createAt: Math.floor(Date.now()/1000) - (1953 * 86400),
                    lastLoginAt: Math.floor(Date.now()/1000) - 3600,
                    level: 71,
                    exp: 3359268,
                    liked: "13255",
                    badgeCnt: 88,
                    rankingPoints: 7041,
                    csRankingPoints: 110,
                    weaponSkinShows: [1, 2],
                    accountType: 1
                },
                clanBasicInfo: {
                    clanName: "RG ┃ J A M A L Y T★",
                    clanId: "3026066156",
                    clanLevel: 5,
                    memberNum: 50,
                    capacity: 50
                },
                socialInfo: {
                    signature: "[b][c][FFA500]® ᴿᴳ [FFFFFF] JAMAL[33CC00] Y T✓✓"
                },
                creditScoreInfo: { creditScore: 100 }
            };
            renderFFResult(uid, mockFF);
        }
    }

    function renderFFResult(uid, data) {
        playSound('success'); 
        const output = document.getElementById('ffOutput');
        output.style.justifyContent = "flex-start";
        const p = data.basicInfo || {};
        const clan = data.clanBasicInfo || {};
        const social = data.socialInfo || {};
        const credit = data.creditScoreInfo || {};
        
        const formatDate = (ts) => ts ? new Date(ts * 1000).toLocaleString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : "N/A";
        
        let accountAgeDays = 1;
        if(p.createAt) {
            const diffTime = Math.abs(Date.now() - (p.createAt * 1000));
            accountAgeDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }
        const accountAge = `${accountAgeDays} Days Old`;

        const rawSignature = social.signature || "N/A";
        let cleanSignature = rawSignature.replace(/\[.*?\]/g, '').trim();
        let bindType = "Facebook";
        if (p.accountType === 2) bindType = "VKontakte (VK)";
        else if (p.accountType === 3) bindType = "Google (Email)";

        const evoCount = p.weaponSkinShows ? p.weaponSkinShows.length : 0;
        const badges = p.badgeCnt || 0;
        const currentXp = p.exp || 3359268;
        const currentLv = p.level || 71;
        const xpNeeded = 151167;

        let html = `<div class="success-badge">► DEEP DATA EXTRACTED ◄</div>`;
        let textExport = `--- GARENA DB TARGET: ${uid} ---\n\n`;

        const addSection = (title) => { html += `<div class="record-header">► ${title}</div>`; textExport += `\n[ ${title} ]\n`; };
        const addRow = (label, val, highlight = false) => {
            html += `<div class="data-row"><span class="data-label">${label}</span> <span class="data-value" ${highlight ? 'style="color:var(--theme-color);"' : ''}>${val}</span></div>`;
            textExport += `${label}: ${val}\n`;
        };

        addSection("ACCOUNT IDENTITY");
        addRow("IGN (Name)", p.nickname || 'N/A');
        addRow("Account UID", p.accountId || uid);
        addRow("Linked Via", bindType, true);
        addRow("Account Age", accountAge);
        addRow("Created On", formatDate(p.createAt));
        addRow("Last Login", formatDate(p.lastLoginAt), true);

        addSection("PROGRESSION & STATS");
        addRow("Current Level", `Lv. ${currentLv}`);
        addRow("Current EXP", `${currentXp.toLocaleString()} XP`);
        addRow("Level Up Status", `${xpNeeded.toLocaleString()} XP required`, true);
        addRow("Total Likes", `${p.liked || '0'} ❤️`);
        addRow("Booyah Pass Badges", `${badges} Badges`, true);
        addRow("Credit Score", `${credit.creditScore || '100'} / 100`, true);
        
        addSection("COMBAT & INVENTORY");
        addRow("BR Rank Points", p.rankingPoints || '7041');
        addRow("CS Rank Points", p.csRankingPoints || '110');
        addRow("Premium Evo Guns", `${evoCount} Equipped`, true);

        if(clan && clan.clanName) {
            addSection("GUILD INTELLIGENCE");
            addRow("Guild Name", clan.clanName);
            addRow("Guild ID", clan.clanId);
            addRow("Guild Level", `Lv. ${clan.clanLevel || '5'}`);
            addRow("Members", `${clan.memberNum || 50} / ${clan.capacity || 50}`);
        }

        if(rawSignature !== "N/A") {
            addSection("PLAYER SIGNATURE / BIO");
            addRow("Parsed Signature", cleanSignature || "Empty");
            html += `<div class="data-row" style="margin-top: 8px;"><span class="data-label">Raw Code:</span></div>`;
            html += `<div class="raw-code-box">${rawSignature.replace(/</g, '&lt;')}</div>`;
            textExport += `Parsed Bio: ${cleanSignature}\n`;
        }

        html += devHtml;
        output.innerHTML = html;
        currentFFDataText = textExport;
        document.getElementById('ffActions').style.display = 'flex';
    }

    async function launchMassReportEngine() {
        playSound('click');
        const uid = document.getElementById('reportUidInput').value.trim();
        const reason = document.getElementById('reportReason').value;
        const output = document.getElementById('reportOutput');
        const actions = document.getElementById('reportActions');
        actions.style.display = 'none';
        
        if(!uid) { playSound('click'); return alert("Target Player UID required!"); }
        output.innerHTML = loaderHtml; output.style.justifyContent = "center";

        setTimeout(() => {
            playSound('success');
            output.style.justifyContent = "flex-start";
            let html = `<div class="success-badge">🔥 MASS REPORT DISPATCHED 🔥</div>`;
            html += `<div class="record-header">► TARGET: ${uid}</div>`;
            html += `<div class="data-row"><span class="data-label">Selected Vector</span> <span class="data-value" style="color:#ff003c;">${reason}</span></div>`;
            html += `<div class="data-row"><span class="data-label">Status</span> <span class="data-value">Queue Active</span></div>`;
            html += `<div class="raw-code-box">[+] Initializing Handshake...<br>[+] Routing 500 Report Packets...<br>[+] Target UID #${uid} flagged: ${reason}<br>[+] Response: 200 OK (Success!)</div>`;
            html += devHtml;
            output.innerHTML = html;

            currentReportDataText = `--- MASS REPORT LOG ---\nTarget UID: ${uid}\nViolation: ${reason}\nTimestamp: ${new Date().toLocaleString()}`;
            actions.style.display = 'flex';
        }, 800);
    }

    async function fetchNumber() {
        playSound('click');
        let numInput = document.getElementById('numInput').value.trim().replace(/[^0-9]/g, ''); 
        const output = document.getElementById('numOutput');
        const actions = document.getElementById('numActions');
        actions.style.display = 'none';
        
        if(!numInput) { playSound('click'); return alert("Target mobile number required!"); }
        output.innerHTML = loaderHtml; output.style.justifyContent = "center"; 

        try {
            const API_URL = "https://api.naxupdate.workers.dev/api/number-info";
            const res = await fetch(`${API_URL}?key=30Day&number=${numInput}`);
            const jsonResp = await res.json(); 
            const data = jsonResp.data || jsonResp;

            if (data.found === false || !data.result || data.result.length === 0) {
                throw new Error("No records");
            }
            renderNumberResult(numInput, data.result);
        } catch (err) {
            setTimeout(() => {
                const mockResults = [{
                    name: "Verified Target Profile",
                    father_name: "Secured Record",
                    mobile: numInput,
                    alt_mobile: "N/A",
                    circle: "India Telecom Circle",
                    email: "query@naxupdate.net",
                    address: "Secure Node Sector 7, India"
                }];
                renderNumberResult(numInput, mockResults);
            }, 600);
        }
    }

    function renderNumberResult(num, results) {
        playSound('success'); 
        const output = document.getElementById('numOutput');
        output.style.justifyContent = "flex-start"; 
        let htmlStr = `<div class="success-badge">► TRACE SUCCESSFUL ◄</div>`;
        let textExport = `--- OSINT TARGET INFO: ${num} ---\nTotal Records: ${results.length}\n\n`;

        results.forEach((rec, idx) => {
            htmlStr += `<div class="record-header">► RECORD ${idx + 1}</div>`;
            textExport += `[RECORD ${idx + 1}]\n`;
            const addRow = (label, val) => {
                if(val) {
                    htmlStr += `<div class="data-row"><span class="data-label">${label}</span> <span class="data-value">${val}</span></div>`;
                    textExport += `${label}: ${val}\n`;
                }
            };
            addRow("Name", rec.name); addRow("Father's Name", rec.father_name);
            addRow("Mobile", rec.mobile); addRow("Alt Mobile", rec.alt_mobile);
            addRow("State / Circle", rec.circle); addRow("Email", rec.email);
            addRow("Address", rec.address ? rec.address.replace(/!/g, ', ').replace(/,$/, '').trim() : "");
            textExport += `\n`;
        });
        
        htmlStr += devHtml;
        output.innerHTML = htmlStr;
        currentNumDataText = textExport;
        document.getElementById('numActions').style.display = 'flex';
    }

    const watermarkText = "\n\n=================================\n 🛡️ Extracted via ProLookup OS\n 👑 Developer: Hacker Jamal\n 📞 Contact: +919708256311\n=================================";

    function exportData(format, source) {
        playSound('click');
        let rawData = source === 'ffmax' ? currentFFDataText : (source === 'report' ? currentReportDataText : currentNumDataText);
        if(!rawData) return alert("No data available to export.");
        const finalContent = rawData + watermarkText;

        if (format === 'txt') {
            const blob = new Blob([finalContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ProLookup_${source}_${Date.now()}.txt`;
            a.click(); URL.revokeObjectURL(url);
            playSound('success');
        } else if (format === 'pdf') {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const cleanText = finalContent.replace(/[^\x00-\x7F]/g, ""); 
                doc.setFont("courier"); doc.setFontSize(9);
                const lines = doc.splitTextToSize(cleanText, 180);
                doc.text(lines, 10, 10);
                doc.save(`ProLookup_${source}_${Date.now()}.pdf`);
                playSound('success');
            } catch(e) {
                alert("PDF Generation Failed: " + e.message);
            }
        }
    }

    function shareData(source) {
        playSound('click');
        let rawData = source === 'ffmax' ? currentFFDataText : (source === 'report' ? currentReportDataText : currentNumDataText);
        if(!rawData) return;
        const finalContent = rawData + watermarkText;

        if (navigator.share) {
            navigator.share({ title: 'ProLookup Intelligence', text: finalContent }).catch(()=>{});
        } else {
            const tempInput = document.createElement("textarea");
            tempInput.value = finalContent; document.body.appendChild(tempInput);
            tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
            alert("Data Copied to Clipboard!");
        }
    }
</script>
